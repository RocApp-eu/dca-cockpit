/* ---------- CoefGauge ---------- */
function CoefGauge({ value = 1.45, size = 320, accent = '#4a9eff', glow = true, animate = true }) {
  const frac = Math.max(0, Math.min(1, (value - 0.5) / 1.5));
  const angle = -90 + 180 * frac;
  const dashLen = Math.PI * 130;
  const fill = dashLen * frac;
  const offset = dashLen - fill + 32;
  const animKey = `needleSpin-${String(value).replace(/\./g, '_')}`;

  return (
    <svg viewBox="0 0 280 170" width={size} style={{ overflow: 'visible', maxWidth: '100%' }}>
      <defs>
        <linearGradient id={`arcG-${accent.replace('#','')}`} x1="0%" x2="100%">
          <stop offset="0%" stopColor="#2563eb" />
          <stop offset="55%" stopColor={accent} />
          <stop offset="100%" stopColor="#9cc7ff" />
        </linearGradient>
      </defs>
      <path d="M 10 140 A 130 130 0 0 1 270 140" fill="none" stroke="rgba(120,150,200,0.10)" strokeWidth="8" strokeLinecap="round" />
      <path d="M 10 140 A 130 130 0 0 1 270 140" fill="none"
        stroke={`url(#arcG-${accent.replace('#','')})`} strokeWidth="8" strokeLinecap="round"
        strokeDasharray={dashLen} strokeDashoffset={animate ? dashLen : offset}
        style={{
          animation: animate ? `arcFill-${animKey} 1.6s cubic-bezier(.22,.61,.36,1) .2s forwards` : 'none',
          filter: glow ? `drop-shadow(0 0 10px ${accent}88)` : 'none',
        }} />
      {[0.5, 1.0, 1.5, 2.0].map((tv) => {
        const tFrac = (tv - 0.5) / 1.5;
        const tAng = -90 + 180 * tFrac;
        const rad = (tAng * Math.PI) / 180;
        const x1 = 140 + Math.cos(rad) * 122;
        const y1 = 140 + Math.sin(rad) * 122;
        const x2 = 140 + Math.cos(rad) * 116;
        const y2 = 140 + Math.sin(rad) * 116;
        return <line key={tv} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(120,150,200,0.4)" strokeWidth="1.5" strokeLinecap="round" />;
      })}
      <g style={{ transformOrigin: '140px 140px', transform: `rotate(${angle - 90}deg)`,
        animation: animate ? `${animKey} 1.4s cubic-bezier(.22,.61,.36,1) .35s both` : 'none',
        filter: glow ? `drop-shadow(0 0 6px ${accent})` : 'none' }}>
        <line x1="140" y1="140" x2="140" y2="22" stroke={accent} strokeWidth="2.2" strokeLinecap="round" />
        <circle cx="140" cy="22" r="4" fill={accent} />

      <circle cx="140" cy="140" r="3" fill={accent} />
      <style>{`
        @keyframes arcFill-${animKey} { from { stroke-dashoffset: ${dashLen}; } to { stroke-dashoffset: ${offset}; } }
        @keyframes ${animKey} {
          0% { transform: rotate(-180deg); }
          70% { transform: rotate(${angle - 90 + 4}deg); }
          100% { transform: rotate(${angle - 90}deg); }
        }
      `}</style>
    </svg>
  );
}

/* ---------- Sparkline ---------- */
function Sparkline({ data, width = 120, height = 30, color = '#4a9eff', fill = true, animate = true }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const pts = data.map((d, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((d - min) / range) * (height - 4) - 2;
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const area = d + ` L${width},${height} L0,${height} Z`;
  const id = `sp-${color.replace('#', '')}-${data.length}-${Math.random().toString(36).slice(2,7)}`;
  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {fill && <path d={area} fill={`url(#${id})`} style={{ opacity: animate ? 0 : 1, animation: animate ? 'fadeIn .5s ease 1.1s forwards' : 'none' }} />}
      <path d={d} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round"
        strokeDasharray="240" strokeDashoffset={animate ? 240 : 0}
        style={{ animation: animate ? 'sparkDraw 1.4s ease-out .4s forwards' : 'none' }} />
    </svg>
  );
}

  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10 }}>
        <span style={{ fontSize: 13, color: muted, fontWeight: 500 }}>{label}</span>

          background: `linear-gradient(90deg, ${accent}, #2563eb)`, boxShadow: `0 0 10px ${accent}80` }} />
        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))}
          aria-label={label}
          style={{ position: 'absolute', inset: 0, width: '100%', opacity: 0, cursor: 'pointer', margin: 0, height: '100%' }} />
        <div style={{ position: 'absolute', top: 10, left: `calc(${pct}% - 8px)`, width: 16, height: 16, borderRadius: '50%',
          background: '#fff', boxShadow: `0 0 0 4px ${accent}40, 0 0 16px ${accent}`, pointerEvents: 'none' }} />
        {ticks.map((t, i) => {
          const tPct = ((t.at - min) / (max - min)) * 100;

            <div key={i} style={{ position: 'absolute', top: 24, left: `${tPct}%`, transform: 'translateX(-50%)', fontSize: 10, color: muted, fontFamily: "'JetBrains Mono', monospace" }}>{t.label}</div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- Backtest chart ---------- */
function BacktestChart({ width = 1280, height = 300, accent = '#4a9eff' }) {
  const weeks = 120;
  const naive = [];
  const cockpit = [];
  let nVal = 100, cVal = 100;
  for (let i = 0; i < weeks; i++) {
    const drift = 0.0018;
    const vol = (Math.sin(i * 0.31) * 0.025 + Math.sin(i * 0.13 + 1) * 0.018);
    nVal = nVal * (1 + drift + vol);
    const boost = vol < 0 ? -vol * 1.4 : -vol * 0.5;
    cVal = cVal * (1 + drift + vol + boost * 0.4);
    naive.push(nVal);
    cockpit.push(cVal);
  }
  const all = [...naive, ...cockpit];
  const min = Math.min(...all), max = Math.max(...all);
  const range = max - min;
  const xy = (arr) => arr.map((v, i) => {
    const x = (i / (arr.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 40) - 20;
    return [x, y];
  });
  const pathFrom = (pts) => pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');
  const nPts = xy(naive), cPts = xy(cockpit);
  const muted = '#3b4654';
  const text = '#6b7888';

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} style={{ overflow: 'visible', maxWidth: '100%', height: 'auto' }}>
      <defs>
        <linearGradient id="bt-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={accent} stopOpacity="0.32" />
          <stop offset="100%" stopColor={accent} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0, 1, 2, 3, 4].map((i) => (
        <line key={i} x1="0" x2={width} y1={(height - 40) / 4 * i + 10} y2={(height - 40) / 4 * i + 10} stroke={muted} strokeDasharray="2 4" strokeWidth="0.5" opacity="0.4" />
      ))}
      <path d={pathFrom(cPts) + ` L${width},${height} L0,${height} Z`} fill="url(#bt-fill)" />
      <path d={pathFrom(nPts)} fill="none" stroke={text} strokeWidth="1.5" strokeDasharray="4 4" opacity="0.8" />
      <path d={pathFrom(cPts)} fill="none" stroke={accent} strokeWidth="2.5" strokeLinecap="round"
        style={{ strokeDasharray: 2400, strokeDashoffset: 2400, animation: 'btDraw 1.8s ease-out .3s forwards', filter: `drop-shadow(0 0 6px ${accent}80)` }} />
      <circle cx={cPts[cPts.length - 1][0]} cy={cPts[cPts.length - 1][1]} r="5" fill={accent} style={{ filter: `drop-shadow(0 0 10px ${accent})` }} />
      <circle cx={nPts[nPts.length - 1][0]} cy={nPts[nPts.length - 1][1]} r="4" fill={text} />
    </svg>
  );
}

/* Responsive overrides */
const responsiveCSS = `
@media (max-width: 1100px) {
  .dca-nav-links a:nth-child(2), .dca-nav-links a:nth-child(4) { display: none !important; }
}
@media (max-width: 1024px) {
  .dca-hero-grid { grid-template-columns: 1fr !important; }
  .dca-hero-phone { min-height: 0 !important; margin-top: 24px; }
  .dca-how-grid, .dca-features-grid { grid-template-columns: 1fr 1fr !important; }
  .dca-algo-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
  .coef-demo-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
  .dca-bt-stats { grid-template-columns: repeat(2, 1fr) !important; }
}
@media (max-width: 720px) {
  .dca-nav-links { display: none !important; }
  .dca-how-grid, .dca-features-grid { grid-template-columns: 1fr !important; }
  .dca-hero-row { grid-template-columns: 1fr !important; }
  .dca-hero-row > div { border-left: none !important; border-top: 1px solid rgba(120,150,200,0.10); }
  .dca-hero-row > div:first-child { border-top: none !important; }
  .dca-footer { flex-direction: column; align-items: flex-start; }
}
.coef-demo-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 36px; align-items: center; }
`;

function App() {
  useEffect(() => {
    const fb = document.getElementById('root-fallback');
    if (fb) { fb.classList.add('hide'); setTimeout(() => fb.remove(), 400); }
    const style = document.createElement('style');
    style.textContent = responsiveCSS;
    document.head.appendChild(style);
  }, []);
  return (
    <React.Fragment>
      <div className="dca-bg-ambient" aria-hidden="true" />
      <div className="dca-bg-grid" aria-hidden="true" />
      <Landing />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
