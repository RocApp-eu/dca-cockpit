name: Déploiement Cloudflare

# Déploie automatiquement le cockpit à chaque push sur main.
# Plus besoin de terminal : tu pushes depuis GitHub Desktop, ça se met en ligne.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Évite deux déploiements simultanés.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build (export statique Next.js)
        working-directory: web
        # Config Firebase web : ce ne sont PAS des secrets (clés publiques côté
        # client, protégées par les règles Firestore et les domaines autorisés).
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDQHY3wkHw9Fw9Vz0OTYPpqmpjtytiBmtE
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dca-cockpit-web.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dca-cockpit-web
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: dca-cockpit-web.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "453742080792"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:453742080792:web:fa390c0f1fa37516c0e46d"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-N77077MBQ7
        run: |
          npm ci
          npm run build

      # Le token colle dans le secret peut contenir un saut de ligne parasite,
      # ce qui casse l'en-tete Authorization. On retire tout espace (les tokens
      # Cloudflare n'en contiennent jamais) et on re-masque la valeur nettoyee.
      - name: Normaliser le token Cloudflare
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLEAN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN"
          echo "CF_API_TOKEN=$CLEAN" >> "$GITHUB_ENV"

      - name: Deploy vers Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          # Wrangler 3.x appelle /memberships (interdit aux tokens "scoped") et
          # echoue (code 9106). On epingle wrangler 4, qui deploie avec le seul
          # account ID, comme en local.
          wranglerVersion: "4.100.0"
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: e0b470a35962b3f35f8b1f75242360cc
